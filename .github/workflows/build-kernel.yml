name: build-dijun-kernel

on:
  workflow_dispatch:
  push:
    branches: [main, upstream-align, feat/kernel-owner-exempt, finasu-v23-compat]

concurrency:
  group: build-dijun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # 正式版：恢复 CONFIG_PANIC_ON_OOPS 默认（y）
      DIAG_NO_PANIC: "0"
      # upstream-align：SUSFS 走官方 v2.4.0 实现（自研阶段由 SUSFS_UPSTREAM=1 关闭）
      SUSFS_UPSTREAM: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev libdw-dev libdwarf-dev \
            dwarves cpio kmod lz4 xz-utils python3 \
            clang-18 lld-18 llvm-18
          # Debian 系有些版本把 dwarf.h 放在 libdwarf/ 子目录，内核却按 <dwarf.h> 引用
          if [ ! -e /usr/include/dwarf.h ] && [ -e /usr/include/libdwarf/dwarf.h ]; then
            sudo ln -s /usr/include/libdwarf/dwarf.h /usr/include/dwarf.h
          fi
          ls -la /usr/include/dwarf.h /usr/include/openssl/opensslv.h
          clang-18 --version | head -1

      - name: 准备 AOSP prebuilt clang + rust
        run: |
          set -euo pipefail
          set +o pipefail          # 探测类命令允许空输出，别让 pipefail 打断
          # 工具链必须来自 AOSP：
          #   gendwarfksyms 的 CRC 依赖 DWARF，clang 版本要一致
          #   rustc 的 LLVM 要匹配 clang（CONFIG_RUSTC_CLANG_LLVM_COMPATIBLE）
          curl -sL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x /usr/local/bin/repo
          mkdir -p /tmp/ws && cd /tmp/ws
          repo init -u https://android.googlesource.com/kernel/manifest \
                    -b common-android17-6.18-2026-06 --depth=1 --no-repo-verify \
            || echo "::warning::repo init 失败"
          # rust 在 manifest 里叫 prebuilts/rust-toolchain/linux-x86（groups=ddk）
          repo sync -c -j4 --no-tags --no-clone-bundle -q \
                    platform/prebuilts/clang/host/linux-x86 \
                    platform/prebuilts/rust-toolchain/linux-x86 \
            || echo "::warning::repo sync 部分失败，继续探测已有内容"

          echo "--- sync 结果 ---"
          ls /tmp/ws/prebuilts 2>/dev/null | head -6
          echo "--- rust 版本目录 ---"
          ls /tmp/ws/prebuilts/rust-toolchain/linux-x86 2>/dev/null | head -8

          CL=$(ls -d /tmp/ws/prebuilts/clang/host/linux-x86/clang-r* 2>/dev/null | sort -V | tail -1)
          if [ -n "$CL" ] && [ -x "$CL/bin/clang" ]; then
            echo "AOSP_CLANG=$CL" >> "$GITHUB_ENV"
            "$CL/bin/clang" --version | head -1
          else
            echo "::warning::没拉到 AOSP clang"
          fi

          # 目录名排序取最新是错的：1.91.1.p4 用的是 LLVM 23，而设备内核是
          # LLVM 22（CONFIG_RUSTC_LLVM_VERSION=220001），
          # CONFIG_RUSTC_CLANG_LLVM_COMPATIBLE 检查不过，CONFIG_RUST 直接关掉，
          # ASHMEM 跟着没，camera 崩。按 rustc 自报的 LLVM 版本挑。
          echo "--- 各版本 rustc 的 LLVM ---"
          RC=""
          for d in /tmp/ws/prebuilts/rust-toolchain/linux-x86/1.91.1*; do
            [ -x "$d/bin/rustc" ] || continue
            LV=$("$d/bin/rustc" -vV 2>/dev/null | sed -n 's/^LLVM version: *//p' || true)
            echo "    $(basename "$d") -> LLVM ${LV:-未知}"
            case "$LV" in
              22.*) RC="$d/bin/rustc" ;;
            esac
          done
          if [ -n "$RC" ]; then
            echo "AOSP_RUSTC=$RC" >> "$GITHUB_ENV"
            "$RC" --version
          else
            echo "::warning::没找到 LLVM 22 的 rustc，CONFIG_RUST 会关，camera 大概率仍崩"
          fi

          echo "LIBCLANG_PATH=$CL/lib" >> "$GITHUB_ENV"

          BG=$(ls -d "$CL"/bin/bindgen 2>/dev/null | head -1)
          if [ -n "$BG" ] && [ -x "$BG" ]; then
            echo "AOSP_BINDGEN=$BG" >> "$GITHUB_ENV"
            "$BG" --version | head -1
          else
            # clang 包里不带 bindgen，rustc 1.91.1-dev 又编不过老 crate
            # （memchr 报错），逐个降版本试，最后用 apt 兜底。
            CARGO=$(dirname "$RC")/cargo
            # bindgen 与编内核的 rustc 是解耦的：bindgen 只是个独立二进制，
            # 用哪个 rustc 编都行。而 AOSP 的 1.91.1-dev 太新，bindgen 0.72.1
            # 锁定的老 crate（libc / version-check / unicode-ident）编不过；
            # 0.71.0 虽然能编，但生成的 blk_mq_tag_set 变成 opaque，Rust 侧报
            # "has no field named ops"。所以用 rustup 装个老 rustc 来编 bindgen。
            if [ -x "$CARGO" ]; then
              LIBCLANG_PATH="$CL/lib" "$CARGO" install bindgen-cli --version 0.72.1 \
                --locked --root /tmp/bg 2>&1 | tail -4 || true
            fi
            if [ ! -x /tmp/bg/bin/bindgen ]; then
              echo "--- 用 rustup 1.78 编 bindgen 0.72.1 ---"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain 1.78.0 --profile minimal 2>&1 | tail -3 || true
              if [ -x "$HOME/.cargo/bin/cargo" ]; then
                LIBCLANG_PATH="$CL/lib" "$HOME/.cargo/bin/cargo" install bindgen-cli \
                  --version 0.72.1 --locked --root /tmp/bg 2>&1 | tail -5 || true
              fi
            fi
            if [ ! -x /tmp/bg/bin/bindgen ]; then
              echo "--- 回落 apt ---"
              sudo apt-get install -y bindgen 2>&1 | tail -3 || true
            fi
            if [ -x /tmp/bg/bin/bindgen ]; then
              # bindgen 0.71 的 --version 不被识别（被当成位置参数 HEADER），
              # 而内核 scripts/rust_is_available.sh 正是靠解析 `bindgen --version`
              # 的输出拿版本号，直接把这一行变成致命错误。包一层 wrapper：
              # --version 吐固定串，其余参数原样透传。
              BV=$(/tmp/bg/bin/bindgen --version 2>/dev/null | head -1 || true)
              case "$BV" in
                bindgen*) : ;;
                *)
                  mv /tmp/bg/bin/bindgen /tmp/bg/bin/bindgen.real
                  printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "bindgen 0.71.0"; exit 0; fi\nexec "$(dirname "$0")/bindgen.real" "$@"\n' > /tmp/bg/bin/bindgen
                  chmod +x /tmp/bg/bin/bindgen
                  echo "    已包 wrapper 处理 --version"
                  ;;
              esac
              echo "AOSP_BINDGEN=/tmp/bg/bin/bindgen" >> "$GITHUB_ENV"
              /tmp/bg/bin/bindgen --version || true
            elif command -v bindgen >/dev/null 2>&1; then
              echo "AOSP_BINDGEN=$(command -v bindgen)" >> "$GITHUB_ENV"
              bindgen --version | head -1
            else
              echo "::warning::bindgen 仍然没有"
            fi
          fi

      - name: 拉取 android17-6.18 源码
        run: |
          set -o pipefail
          bash ci/fetch-kernel.sh 2>&1 | tee kernel-fetch.log

      - name: 集成 SukiSU(built-in) + SUSFS SELinux 隐藏
        run: |
          set -o pipefail
          mkdir -p out
          bash ci/integrate.sh 2>&1 | tee out/integrate.log

      # finasu-v23-compat: 内核信任的管理器签名必须跟随官方最新版，
      # 不能写死证书 —— 否则编出信任 v1.5 的内核，用户却装了 v1.6 管理器，
      # 签名对不上就拿不到 root。这里从 releases/latest 现取 APK 解出证书。
      # 主路径走 github.com 网页 + git 协议（不受 api.github.com 匿名 60/h 限流）；
      # Actions 共享出口 IP 的匿名 API 会被别人打满返回 403（#152 实测），故 API 仅兜底。
      - name: 抓取 FinaSU 最新管理器签名
        run: |
          set -euo pipefail
          repo="LyraVoid/FinaSU"
          api="https://api.github.com/repos/$repo"
          web="https://github.com/$repo"
          apk="$GITHUB_WORKSPACE/manager.apk"
          get() { curl -fsSL --retry 3 --max-time 60 "$1"; }

          # 主路径（网页，无 API 限流）：git ls-remote 取最新 tag，expanded_assets 取 release apk 直链
          tag=""
          url=""
          if t=$(git ls-remote --tags --refs "https://github.com/$repo.git" 'refs/tags/v*' \
                 | sed 's|.*refs/tags/||' | sort -V | tail -1) && [ -n "$t" ]; then
            tag="$t"
            echo "管理器版本(网页): $tag"
            rel=$(get "$web/releases/expanded_assets/$tag" | python3 -c '
          import sys,re
          links=re.findall(r"href=\"([^\"]+\.apk)\"", sys.stdin.read())
          pref=[x for x in links if "release" in x] or links
          print(pref[0] if pref else "")') || true
            if [ -n "$rel" ]; then
              url="https://github.com$rel"
            fi
          fi

          # 兜底：网页通道拿不到（页面改版/网络问题）才碰 API；全程匿名，不带 GITHUB_TOKEN
          if [ -z "$tag" ] || [ -z "$url" ]; then
            echo "网页通道不完整，回退 API"
            tag=$(get "$api/releases/latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
            meta=$(get "$api/releases/tags/$tag")
            url=$(printf '%s' "$meta" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          a=[x for x in d["assets"] if x["name"].endswith(".apk")]
          p=[x for x in a if "release" in x["name"]] or a
          print(p[0]["browser_download_url"] if p else "")')
          fi
          echo "管理器版本: $tag"
          if [ -z "$url" ]; then
            echo "::error::LyraVoid/FinaSU release $tag 里没有 release apk 资产"
            exit 1
          fi

          echo "下载: $url"
          curl -fsSL --retry 3 --max-time 180 -o "$apk" "$url"
          ls -l "$apk"
          # 下载下来的必须是可解析的 APK（zipfile 能打开），否则后面解证书只会给出误导性错误
          python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]); print("APK 校验 OK")' "$apk"

          python3 tools/manager_identity.py "$apk" | tee "$GITHUB_WORKSPACE/mgr.txt"
          # manager_identity.py 默认输出 key=value，直接进 $GITHUB_ENV
          cat "$GITHUB_WORKSPACE/mgr.txt" >> "$GITHUB_ENV"
          echo "MANAGER_TAG=$tag" >> "$GITHUB_ENV"
          # 映射到 build.sh 读的变量名
          echo "MANAGER_CERT_SIZE=$(awk -F= '/^cert_size=/{print $2}' "$GITHUB_WORKSPACE/mgr.txt")" >> "$GITHUB_ENV"
          echo "MANAGER_CERT_HASH=$(awk -F= '/^cert_sha256=/{print $2}' "$GITHUB_WORKSPACE/mgr.txt")" >> "$GITHUB_ENV"

      - name: 编译 Image 并抽取 BTF
        run: |
          set -o pipefail
          mkdir -p out
          bash ci/build.sh 2>&1 | tee out/build.log

      - name: 失败诊断
        if: failure()
        run: |
          echo "=== 工具版本 ==="
          pahole --version || true
          clang --version | head -2 || true
          ld.lld --version | head -1 || true
          echo "=== kernel/scripts/Makefile.btf 实际 flags ==="
          grep -nE 'pahole-flags-y|btf_features|PAHOLE_FLAGS' kernel/scripts/Makefile.btf || true
          echo "=== vmlinux 段表（找 .BTF）==="
          if [ -f kernel/vmlinux ]; then
            readelf -S kernel/vmlinux 2>/dev/null | grep -iE "btf|debug_info" || echo "(无 .BTF / .debug_info)"
          else
            echo "(kernel/vmlinux 不存在)"
          fi
          echo "=== 编译日志尾部 60 行 ==="
          tail -60 out/build.log || true

      - name: 与设备 BTF 对比 ABI
        run: |
          set -o pipefail
          # 有差异是"结论"，不是"错误"：脚本发现不一致时返回 1，
          # 这里吞掉退出码，结论看报告；比对本身跑挂了才会因为输出缺失被发现。
          python3 tools/btf_compare.py \
            --kernel out/vmlinux.btf \
            --device config/vmlinux_os4.0.4.btf \
            --allow-missing \
            --json out/btf-report.json | tee -a out/build.log || true

      - name: 打包 AK3
        if: hashFiles('out/Image') != ''
        run: |
          set -eux
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 /tmp/ak3
          rm -rf /tmp/ak3/.git /tmp/ak3/.github /tmp/ak3/modules /tmp/ak3/patch /tmp/ak3/ramdisk
          cp "$GITHUB_WORKSPACE/out/Image" /tmp/ak3/Image
          cp "$GITHUB_WORKSPACE/ak3/anykernel.sh" /tmp/ak3/anykernel.sh
          # finasu-v23-compat: 包名带 FinaSU 管理器版本号，版本号取自上面
          # releases/latest 自动抓到的 tag（如 v1.6.4），管理器升级后包名自动跟随。
          # ${MANAGER_TAG#v} 去掉前缀 v：finasu1.6.4（不加空格，避免刷机/下载转义问题）
          FINASU_VER="${MANAGER_TAG#v}"
          AK3_NAME="ak3-xring-o1-6.18-finasu${FINASU_VER}-susfs2.4-gki553682993.zip"
          ( cd /tmp/ak3 && zip -r9 "$GITHUB_WORKSPACE/out/$AK3_NAME" . )
          ls -l out/*.zip
          sha256sum out/*.zip
          unzip -l "$GITHUB_WORKSPACE/out/$AK3_NAME"

      - name: 摘要
        if: always()
        run: python3 tools/summary.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dijun-kernel-${{ github.run_number }}
          path: |
            out/
            kernel-fetch.log
          retention-days: 14