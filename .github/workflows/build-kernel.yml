name: build-dijun-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-dijun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev libdw-dev libdwarf-dev \
            dwarves cpio kmod lz4 xz-utils python3 \
            clang-18 lld-18 llvm-18
          # Debian 系有些版本把 dwarf.h 放在 libdwarf/ 子目录，内核却按 <dwarf.h> 引用
          if [ ! -e /usr/include/dwarf.h ] && [ -e /usr/include/libdwarf/dwarf.h ]; then
            sudo ln -s /usr/include/libdwarf/dwarf.h /usr/include/dwarf.h
          fi
          ls -la /usr/include/dwarf.h /usr/include/openssl/opensslv.h
          clang-18 --version | head -1

      # 设备内核是 Android clang r584948c 编的，宿主 clang-18 没有 POR_EL0 支持，
      # 会让 CONFIG_ARM64_POE 在编译器能力探测中被自动关掉 —— user_access_state
      # 从 16 字节缩到 8 字节，BTF 比对里就多出一条假差异。
      # 换同一版 AOSP clang 可以把这类工具链噪声消掉。
      - name: 准备 AOSP clang r584948c
        run: |
          set -euo pipefail
          base="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive"
          got=0
          # googlesource 的 archive 端点要求 ref 里的 / 转义；两种写法都试一遍
          for ref in "refs%2Fheads%2Fmain" "main" "refs/heads/main"; do
            url="$base/$ref/clang-r584948c.tar.gz"
            echo "尝试 $url"
            rm -rf /opt/aosp-clang && mkdir -p /opt/aosp-clang
            if curl -fsSL --retry 1 --max-time 900 "$url" | tar -xz -C /opt/aosp-clang 2>/dev/null \
               && [ -x /opt/aosp-clang/bin/clang ]; then
              got=1; break
            fi
          done
          if [ "$got" = 1 ]; then
            echo "/opt/aosp-clang/bin" >> "$GITHUB_PATH"
            /opt/aosp-clang/bin/clang --version | head -1
          else
            echo "::warning::AOSP clang 获取失败，回落到系统 clang-18（POR_EL0 相关差异会保留）"
          fi

      - name: 拉取 android17-6.18 源码
        run: |
          set -o pipefail
          bash ci/fetch-kernel.sh 2>&1 | tee kernel-fetch.log

      - name: 编译 Image 并抽取 BTF
        run: |
          set -o pipefail
          mkdir -p out
          bash ci/build.sh 2>&1 | tee out/build.log

      - name: 失败诊断
        if: failure()
        run: |
          echo "=== 工具版本 ==="
          pahole --version || true
          clang --version | head -2 || true
          ld.lld --version | head -1 || true
          echo "=== kernel/scripts/Makefile.btf 实际 flags ==="
          grep -nE 'pahole-flags-y|btf_features|PAHOLE_FLAGS' kernel/scripts/Makefile.btf || true
          echo "=== vmlinux 段表（找 .BTF）==="
          if [ -f kernel/vmlinux ]; then
            readelf -S kernel/vmlinux 2>/dev/null | grep -iE "btf|debug_info" || echo "(无 .BTF / .debug_info)"
          else
            echo "(kernel/vmlinux 不存在)"
          fi
          echo "=== 编译日志尾部 60 行 ==="
          tail -60 out/build.log || true

      - name: 与设备 BTF 对比 ABI
        run: |
          set -o pipefail
          python3 tools/btf_compare.py \
            --kernel out/vmlinux.btf \
            --device config/vmlinux_os4.0.4.btf \
            --allow-missing \
            --json out/btf-report.json | tee -a out/build.log

      - name: 摘要
        if: always()
        run: python3 tools/summary.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dijun-kernel-${{ github.run_number }}
          path: |
            out/
            kernel-fetch.log
          retention-days: 14
